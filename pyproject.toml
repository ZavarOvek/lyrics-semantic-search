[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "SLF"]
ignore = [
    # RUF001-003 flag Cyrillic letters as "ambiguous" look-alikes of Latin ones.
    # Docstrings and notes here are partly in Ukrainian, so those are false
    # positives by design.
    "RUF001",
    "RUF002",
    "RUF003",
    # E501 is left to `ruff format`; two tools arguing over line length is worse
    # than one, and the formatter cannot split string literals anyway.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private members of the objects under test.
"tests/*" = ["SLF001"]
