name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # requirements.txt is the demo-corpus install: tfidf + numpy, no torch,
      # no faiss, no model downloads. The faiss and real-data tests skip here
      # by design; everything else, including the synthetic cross-process
      # determinism test, runs for real.
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: core/ coverage must stay at 100%
        run: pytest -q --cov=lyrics_search/core --cov-fail-under=100
